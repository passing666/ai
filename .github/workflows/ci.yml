name: CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test deps
        run: |
          pip install pytest httpx
          pip install black flake8

      - name: Run tests
        run: pytest -q

      - name: Black format check
        run: black --check .

      - name: Flake8 lint
        # Do not fail pipeline for lint in this basic workflow; change as needed
        run: flake8 --max-line-length=88 || true
